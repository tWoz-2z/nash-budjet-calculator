<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101826">
  <title>Наш бюджет — калькулятор</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { color-scheme: dark; font: 16px/1.4 system-ui,-apple-system,Arial,sans-serif; background: #101826; color: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: max(18px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom)); }
    main { max-width: 460px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 2px 0 4px; }
    .hint { font-size: 13px; color: #bac8dc; margin: 0 0 20px; }
    .panel { background: #1c293a; border: 1px solid #354559; border-radius: 18px; padding: 18px; margin-bottom: 14px; min-height: 117px; }
    .expression { color: #b8c6d7; text-align: right; font-size: 16px; overflow-wrap: anywhere; min-height: 25px; }
    .result { text-align: right; font-size: clamp(28px,8vw,42px); font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 9px; overflow-wrap: anywhere; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button { border: 0; border-radius: 14px; font-size: 24px; font-weight: 600; min-height: 64px; background: #29384d; color: #fff; cursor: pointer; touch-action: manipulation; }
    button:active { filter: brightness(1.22); }
    button.operator { background: #405a80; }
    button.clear { background: #664354; }
    button:focus-visible { outline: 2px solid #73b9ff; }
    .send { width: 100%; margin-top: 16px; background: #32936b; min-height: 58px; font-size: 18px; }
    .send:disabled { opacity: .4; cursor: default; }
    #status { min-height: 23px; margin-top: 12px; text-align: center; font-size: 13px; color: #f3cd8b; }
    @media (max-height: 680px) { button { min-height: 54px; } .panel { min-height: 95px; padding: 13px; } .send { min-height: 52px; } }
  </style>
</head>
<body>
<main>
  <h1>Калькулятор</h1>
  <p class="hint">Введи суммы из чека через «+» и нажми «Использовать сумму».</p>
  <div class="panel" aria-live="polite">
    <div class="expression" id="expression">0</div>
    <div class="result" id="result">0,00</div>
  </div>
  <div class="keys" id="keys">
    <button type="button" class="clear" data-key="C">C</button>
    <button type="button" data-key="back" aria-label="Удалить последнюю цифру">⌫</button>
    <button type="button" data-key="00">00</button>
    <button type="button" class="operator" data-key="+">+</button>
    <button type="button" data-key="7">7</button>
    <button type="button" data-key="8">8</button>
    <button type="button" data-key="9">9</button>
    <button type="button" class="operator" data-key="-">−</button>
    <button type="button" data-key="4">4</button>
    <button type="button" data-key="5">5</button>
    <button type="button" data-key="6">6</button>
    <button type="button" class="operator" data-key="=">=</button>
    <button type="button" data-key="1">1</button>
    <button type="button" data-key="2">2</button>
    <button type="button" data-key="3">3</button>
    <button type="button" data-key=",">,</button>
    <button type="button" data-key="0" style="grid-column:span 4">0</button>
  </div>
  <button type="button" class="send" id="send" disabled>Использовать сумму</button>
  <div id="status" role="status"></div>
</main>
<script>
(() => {
  "use strict";
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try { if (typeof tg.requestFullscreen === "function") tg.requestFullscreen(); } catch (_) {}
  }
  let expression = "0";
  const exprEl = document.getElementById("expression");
  const resultEl = document.getElementById("result");
  const sendEl = document.getElementById("send");
  const statusEl = document.getElementById("status");

  function toCents(number) {
    const normalized = number.replace(",", ".");
    if (!/^\d+(?:\.\d{0,2})?$/.test(normalized)) return null;
    const [whole, frac = ""] = normalized.split(".");
    return BigInt(whole) * 100n + BigInt((frac + "00").slice(0, 2));
  }
  function calculate(str) {
    // Calculations use integer kopecks/cents, avoiding floating-point rounding.
    const values = str.split(/([+-])/);
    if (values.length === 0) return null;
    let total = toCents(values[0]);
    if (total === null) return null;
    for (let i = 1; i < values.length; i += 2) {
      const next = toCents(values[i+1] || "");
      if (next === null) return null;
      total = values[i] === "+" ? total + next : total - next;
    }
    // Limit output to prevent unrealistic financial entries.
    return total > 0n && total <= 99999999999999n ? total : null;
  }
  function formatted(cents) {
    if (cents === null) return "—";
    const whole = (cents / 100n).toString();
    const fraction = (cents % 100n).toString().padStart(2, "0");
    return whole.replace(/\B(?=(\d{3})+(?!\d))/g, " ") + "," + fraction;
  }
  function render() {
    const cents = calculate(expression);
    exprEl.textContent = expression.replaceAll(".", ",").replaceAll("-", " − ");
    resultEl.textContent = formatted(cents);
    sendEl.disabled = cents === null;
  }
  function key(k) {
    statusEl.textContent = "";
    if (k === "C") expression = "0";
    else if (k === "back") expression = expression.length > 1 ? expression.slice(0,-1) : "0";
    else if (k === "=") {
      const total = calculate(expression);
      if (total !== null) expression = (total / 100n).toString() + "," + (total % 100n).toString().padStart(2,"0");
    }
    else if (k === "+" || k === "-") {
      if (!/[+-]$/.test(expression) && calculate(expression) !== null) expression += k;
    } else if (k === ",") {
      const current = expression.split(/[+-]/).pop();
      if (!current.includes(",") && !current.includes(".")) expression += ",";
    } else if (/^\d{1,2}$/.test(k)) {
      const current = expression.split(/[+-]/).pop();
      if ((current.split(",")[1] || "").length >= 2 && current.includes(",")) return;
      if (expression.length >= 110) return;
      if (current === "0" && k !== "00") expression = expression.slice(0, -1) + k;
      else expression += k;
    }
    render();
  }
  document.getElementById("keys").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-key]");
    if (button) key(button.dataset.key);
  });
  document.addEventListener("keydown", (event) => {
    const k = event.key;
    const normalized = k === "Backspace" ? "back" : k === "Escape" ? "C" : k === "Enter" ? "=" : k === "." ? "," : k;
    if (/^\d$/.test(normalized) || ["back","C","=",",","+","-"].includes(normalized)) {
      event.preventDefault(); key(normalized);
    }
  });
  sendEl.addEventListener("click", () => {
    const cents = calculate(expression);
    if (cents === null) return;
    if (!tg || typeof tg.sendData !== "function") {
      statusEl.textContent = "Чтобы передать сумму, открой калькулятор кнопкой внутри Telegram.";
      return;
    }
    const amount = (cents / 100n).toString() + "." + (cents % 100n).toString().padStart(2,"0");
    tg.sendData(JSON.stringify({type:"calculator_amount",amount}));
  });
  render();
})();
</script>
</body>
</html>
